# Paper-aligned training config for MA-DBP on VMAS navigation_v2.
h5_path: "data/navigation_v2_Na_4_T_40_dataset.h5"
out_dir: "checkpoints"
run_name: "madbp_paper"

max_agents: 10          # model capacity (N_max at deployment)
n_train_max: 4          # largest team seen in training
horizon: 8              # moving-window size H
diffusion_steps: 150
schedule: "linear"
cfg_dropout_prob: 0.0   # extras below are OFF by default (not in the paper)
min_snr_gamma: null

epochs: 2000
batch_size: 16
lr: 3.0e-4
weight_decay: 1.0e-4
grad_clip: 1.0
num_workers: 4
save_every: 200
device: "cuda"

curriculum: "linear_stage"   # +1 agent every stage_epochs (default epochs // n_train_max)
stage_epochs: null
shuffle_slots: true
subgoal_mode: "expert"
d_min_world: 0.1
d_obs_world: 0.1

# Paper Eq. 8: W = [0.85, 0.025, 0.025, 0.1]
loss_weights:
  denoising: 0.85
  boundary:  0.025
  temporal:  0.025
  collision: 0.10
  velocity:  0.0
  goal:      0.0
