# Same as madbp_navigation_v2.yaml but with classifier-free guidance training.
# At deploy time, pass --guidance-scale 1.5 (or higher) to the sampler.

h5_path: "data/navigation_v2_Na_4_T_40_dataset.h5"
out_dir: "checkpoints"
run_name: "madbp_navigation_v2_n4_cfg"

max_agents: 10
horizon: 8
diffusion_steps: 150
schedule: "linear"
cfg_dropout_prob: 0.10      # ← enables CFG training

epochs: 2000
batch_size: 16
lr: 3.0e-4
weight_decay: 1.0e-4
grad_clip: 1.0
num_workers: 4
log_every: 50
save_every: 200

device: "cuda"
use_curriculum: true

loss_weights:
  denoising: 0.90
  boundary:  0.04
  temporal:  0.06
  velocity:  0.00
  collision: 0.00
  goal:      0.00
